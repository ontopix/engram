name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", "1.26.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/engram

  race-and-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - run: go test -race ./...
      - run: go test ./...
        env:
          GOPROXY: "off"

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - name: YAML profile
        run: go test ./internal/fuzz -run '^$' -fuzz '^FuzzYAMLProfile$' -fuzztime=2s
      - name: Document and Markdown profiles
        run: go test ./internal/fuzz -run '^$' -fuzz '^FuzzDocumentAndMarkdownProfiles$' -fuzztime=2s
      - name: Wikilink profile
        run: go test ./internal/fuzz -run '^$' -fuzz '^FuzzWikilinkProfile$' -fuzztime=2s
      - name: Portable regex
        run: go test ./internal/fuzz -run '^$' -fuzz '^FuzzPortableRegex$' -fuzztime=2s
      - name: Raw commit parser
        run: go test ./internal/fuzz -run '^$' -fuzz '^FuzzRawCommit$' -fuzztime=2s
      - name: Raw tree parser
        run: go test ./internal/fuzz -run '^$' -fuzz '^FuzzRawTree$' -fuzztime=2s
